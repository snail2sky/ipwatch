name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: arm, goarm: "7" }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        env: { GOOS: "${{ matrix.goos }}", GOARCH: "${{ matrix.goarch }}", GOARM: "${{ matrix.goarm }}", CGO_ENABLED: "0" }
        run: |
          ARCH="$GOARCH"; [ -n "$GOARM" ] && ARCH="${GOARCH}v${GOARM}"
          go build -trimpath -ldflags "-s -w" -o "ipwatch_${GITHUB_SHA::8}_${GOOS}_${ARCH}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ipwatch-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ipwatch_*
